<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4F46E5" />
  <title>ConcertJournal – Remember every concert you've seen</title>
  <meta
    name="description"
    content="ConcertJournal is your personal concert diary: log every concert with band, venue, date and rating — then explore your stats, droughts, golden eras and deep dives into your favourite artists and venues."
  />
  <link rel="canonical" href="https://concertjournal.de/" />

  <!-- Open Graph / social previews -->
  <meta property="og:site_name" content="ConcertJournal" />
  <meta property="og:title" content="ConcertJournal – Remember every concert you've seen" />
  <meta
    property="og:description"
    content="Your personal concert diary: rate shows, track artists and venues, and watch your concert stats grow."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://concertjournal.de/" />
  <meta property="og:image" content="https://concertjournal.de/ConcertJournal_logo.png" />
  <meta name="twitter:card" content="summary" />

  <!-- Structured data for search engines -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ConcertJournal",
      "url": "https://concertjournal.de/",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web",
      "description": "Personal concert journal with ratings, statistics and artist/venue deep dives.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
    }
  </script>

  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
