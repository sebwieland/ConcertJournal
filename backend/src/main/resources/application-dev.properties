spring.application.name=ConcertJournalAPI
spring.datasource.url=jdbc:mysql://localhost:3306/concertjournal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.security=DEBUG
spring.mvc.log-request-details=true
server.servlet.session.persistent=true
server.servlet.session.store-dir=./sessionTmp
server.servlet.session.cookie.same-site=Lax
server.shutdown = graceful
management.endpoints.web.exposure.include=*
management.endpoint.metrics.enabled=true
management.prometheus.metrics.export.enabled=true
springdoc.show-actuator=true
server.address=localhost

auth.cookie.httpOnly=false
auth.cookie.secure=false
auth.cookie.domain=

security.headers.hsts.enabled=false
security.headers.hsts.max-age-seconds=0
security.headers.hsts.include-sub-domains=false
security.headers.hsts.preload=false
security.headers.csp.enabled=true
security.headers.csp.policy=default-src 'self' http://localhost:3000; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:3000; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http://localhost:3000; font-src 'self' data:; connect-src 'self' http://localhost:3000; frame-ancestors 'self' http://localhost:3000;
security.headers.x-frame-options.enabled=true
security.headers.x-frame-options.policy=SAMEORIGIN
security.headers.referrer-policy.enabled=true
security.headers.referrer-policy.policy=STRICT_ORIGIN_WHEN_CROSS_ORIGIN
security.headers.permissions-policy.enabled=true
security.headers.permissions-policy.policy=geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()