spring.application.name=ConcertJournalAPI
spring.datasource.url=jdbc:h2:file:./DB/ConcertJournalDB;AUTO_SERVER=TRUE
#spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.mvc.log-request-details=true
server.shutdown = graceful
auth.cookie.same-site=Lax

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.prometheus.metrics.export.enabled=true
springdoc.show-actuator=true
server.address=0.0.0.0

auth.cookie.httpOnly=true
auth.cookie.secure=true
auth.cookie.domain=concertjournal.de

security.headers.hsts.enabled=true
security.headers.hsts.max-age-seconds=31536000
security.headers.hsts.include-sub-domains=true
security.headers.hsts.preload=true
security.headers.csp.enabled=true
security.headers.csp.policy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';
security.headers.x-frame-options.enabled=true
security.headers.x-frame-options.policy=SAMEORIGIN
security.headers.referrer-policy.enabled=true
security.headers.referrer-policy.policy=STRICT_ORIGIN_WHEN_CROSS_ORIGIN
security.headers.permissions-policy.enabled=true
security.headers.permissions-policy.policy=geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()