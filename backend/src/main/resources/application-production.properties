spring.application.name=ConcertJournalAPI

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

app.static.location=file:/app/static/

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.shutdown=graceful
auth.cookie.same-site=Lax
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.prometheus.metrics.export.enabled=true

auth.cookie.httpOnly=true
auth.cookie.secure=true

security.headers.hsts.enabled=true
security.headers.hsts.max-age-seconds=31536000
security.headers.hsts.include-sub-domains=true
security.headers.hsts.preload=true
security.headers.csp.enabled=true
security.headers.csp.policy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';
security.headers.x-frame-options.enabled=true
security.headers.x-frame-options.policy=SAMEORIGIN
security.headers.referrer-policy.enabled=true
security.headers.referrer-policy.policy=STRICT_ORIGIN_WHEN_CROSS_ORIGIN
security.headers.permissions-policy.enabled=true
security.headers.permissions-policy.policy=geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()
