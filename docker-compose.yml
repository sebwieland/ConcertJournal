version: '3.8'

# Concert Journal Docker Compose
#
# Development (hybrid - recommended):
#   docker-compose up -d mysql backend
#   cd frontend && npm run start:local
#
# Production (local test):
#   docker-compose --profile production up --build

services:
  # MySQL Database (shared by dev and prod)
  mysql:
    image: mysql:8.0
    container_name: concert-journal-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: concertjournal
      MYSQL_USER: ${DATABASE_USER:-user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - concert-journal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (development only - with hot reload)
  backend:
    image: maven:3.9-eclipse-temurin-21-alpine
    container_name: concert-journal-backend
    working_dir: /app
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/concertjournal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-password}
      SERVER_ADDRESS: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production!}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: "classpath:db/migration"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./backend/src:/app/src:delegated
      - ./backend/target:/app/target
      - maven-repo:/root/.m2
    networks:
      - concert-journal-network
    command: "./mvnw spring-boot:run"

  # Production app (frontend + backend unified)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: concert-journal-app
    restart: unless-stopped
    profiles: ["production"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/concertjournal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production!!!!!!!!}
    ports:
      - "8080:8080"
    networks:
      - concert-journal-network

networks:
  concert-journal-network:
    driver: bridge

volumes:
  mysql-data:
  maven-repo:
