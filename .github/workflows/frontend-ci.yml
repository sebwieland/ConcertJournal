name: Frontend Checks

on:
  workflow_call:

jobs:
  frontend-checks:
    name: Lint, Audit, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Lint code
        run: |
          cd frontend
          npm run lint

      - name: Security audit (production deps)
        run: |
          cd frontend
          npm audit --omit=dev

      - name: Run unit tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build production bundle (tsc + vite)
        run: |
          cd frontend
          NODE_ENV=production npm run build

      - name: Validate build output
        run: |
          cd frontend
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Build directory is empty or does not exist!"
            exit 1
          fi
