name: Backend Tests

on:
  workflow_call:

env:
  # Dependabot PRs run WITHOUT repository secrets → empty JWT_SECRET would make
  # JwtUtils hard-fail at init and all security tests error out. Fallback keeps
  # those PRs testable; the string is unique, so it passes the app's known-default ban.
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'backend-ci-test-secret-rotate-me-9f3c1d8e77a2' }}

jobs:
  backend-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: |
          cd backend
          mvn -f pom.xml clean test -B

      - name: Create coverage report
        if: always()
        run: |
          cd backend
          mvn jacoco:report -B

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/*
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/*
          retention-days: 7
