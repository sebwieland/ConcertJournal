name: Global CI/CD Orchestrator

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_full_build:
        description: 'Force rebuild of all components'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/change-detection.yml

  trigger-backend:
    name: Backend Tests
    needs: [changes]
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.inputs.force_full_build == 'true'
    uses: ./.github/workflows/backend-ci.yml
    secrets:
      inherit

  trigger-frontend:
    name: Frontend Checks
    needs: [changes]
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.inputs.force_full_build == 'true'
    uses: ./.github/workflows/frontend-ci.yml
    secrets:
      inherit

  e2e-smoke:
    name: E2E Smoke Test (unified container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, trigger-backend, trigger-frontend]
    if: |
      (needs.trigger-backend.result == 'success' || needs.trigger-backend.result == 'skipped') &&
      (needs.trigger-frontend.result == 'success' || needs.trigger-frontend.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx (docker-container driver enables GHA cache export)
        uses: docker/setup-buildx-action@v3

      - name: Build unified production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: concertjournal:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write CI compose file (deployable = CI artifact)
        run: |
          cat > ci-compose.yml <<'EOF'
          services:
            mysql:
              image: mysql:8.0
              environment:
                MYSQL_DATABASE: concertjournal
                MYSQL_USER: user
                MYSQL_PASSWORD: password
                MYSQL_ROOT_PASSWORD: rootpassword
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword"]
                interval: 3s
                timeout: 5s
                retries: 15
            app:
              image: concertjournal:ci
              depends_on:
                mysql:
                  condition: service_healthy
              environment:
                SPRING_PROFILES_ACTIVE: production
                SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/concertjournal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
                SPRING_DATASOURCE_USERNAME: user
                SPRING_DATASOURCE_PASSWORD: password
                JWT_SECRET: ${JWT_SECRET}
                # CI runs on http://localhost — override prod cookie settings
                # that assume the concertjournal.de domain and HTTPS
                AUTH_COOKIE_DOMAIN: ""
                AUTH_COOKIE_SECURE: "false"
                SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
              ports:
                - "8080:8080"
          EOF

      - name: Boot the stack
        env:
          JWT_SECRET: ci-e2e-secret-never-for-production-32+
        run: |
          docker compose -f ci-compose.yml up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 4
          done
          curl -sf http://localhost:8080/actuator/health
          echo "Stack is up — unified container on http://localhost:8080"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --no-audit

      - name: Install Playwright browser
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run E2E journey against the unified container
        env:
          BASE_URL: http://localhost:8080
        run: |
          cd frontend
          npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/e2e/e2e-out/**
          retention-days: 3

      - name: Tear down
        if: always()
        run: docker compose -f ci-compose.yml down -v

  publish-artifacts:
    name: Publish Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, trigger-backend, trigger-frontend, e2e-smoke]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (needs.trigger-backend.result == 'success' || needs.trigger-backend.result == 'skipped') &&
      (needs.trigger-frontend.result == 'success' || needs.trigger-frontend.result == 'skipped') &&
      needs.e2e-smoke.result == 'success'
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.generate-version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Single source of version truth: latest v{N} tag + 1, only applied when
      # a NEW unified image actually ships (i.e. this job runs at all)
      - name: Generate version
        id: generate-version
        run: |
          latest_tag=$(git tag -l 'v*' | grep -v 'rc' | sort -rV | head -n 1 || echo "v0")
          echo "Latest tag: $latest_tag"
          if [[ $latest_tag =~ ^v([0-9]+)$ ]]; then
            new_version="v$((BASH_REMATCH[1] + 1))"
          else
            new_version="v1"
          fi
          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: https://registry.wielandseb.synology.me
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Compute short SHA
        id: shortsha
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push release image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            registry.wielandseb.synology.me/concertjournal:${{ steps.generate-version.outputs.new_version }}
            registry.wielandseb.synology.me/concertjournal:git-${{ steps.shortsha.outputs.sha }}
            registry.wielandseb.synology.me/concertjournal:latest
          labels: |
            org.opencontainers.image.version=${{ steps.generate-version.outputs.new_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=registry.wielandseb.synology.me/concertjournal:cache
          cache-to: type=inline

      # Git tag only after the image push succeeded — no phantom releases
      - name: Push version tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.generate-version.outputs.new_version }}
          git push origin ${{ steps.generate-version.outputs.new_version }}
          echo "Successfully pushed tag ${{ steps.generate-version.outputs.new_version }}"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [changes, trigger-backend, trigger-frontend, e2e-smoke, publish-artifacts]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Stages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend tests: ${{ needs.trigger-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend checks: ${{ needs.trigger-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E smoke (unified container): ${{ needs.e2e-smoke.result }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" != "pull_request" ]]; then
            echo "- Release publish: ${{ needs.publish-artifacts.result }} ${{ needs.publish-artifacts.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
