name: Global CI/CD Orchestrator

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_full_build:
        description: 'Force rebuild of all components'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/change-detection.yml

  trigger-backend:
    name: Backend
    needs: [changes]
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.inputs.force_full_build == 'true'
    uses: ./.github/workflows/backend-ci.yml
    secrets:
      inherit

  trigger-frontend:
    name: Frontend
    needs: [changes]
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.inputs.force_full_build == 'true'
    uses: ./.github/workflows/frontend-ci.yml
    secrets:
      inherit

  build-and-publish:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    needs: [changes, trigger-backend, trigger-frontend]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (needs.trigger-backend.result == 'success' || needs.trigger-backend.result == 'skipped') &&
      (needs.trigger-frontend.result == 'success' || needs.trigger-frontend.result == 'skipped')
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.generate-version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: generate-version
        run: |
          latest_tag=$(git tag -l 'v*' | grep -v 'rc' | sort -rV | head -n 1 || echo "v0")
          echo "Latest tag: $latest_tag"
          
          if [[ $latest_tag =~ ^v([0-9]+)$ ]]; then
            version_number=${BASH_REMATCH[1]}
            new_version_number=$((version_number + 1))
            new_version="v$new_version_number"
          else
            new_version="v1"
          fi
          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: https://registry.wielandseb.synology.me
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push unified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.wielandseb.synology.me/concertjournal:${{ steps.generate-version.outputs.new_version }}
            registry.wielandseb.synology.me/concertjournal:latest
          platforms: linux/amd64
          cache-from: type=registry,ref=registry.wielandseb.synology.me/concertjournal:cache
          cache-to: type=registry,ref=registry.wielandseb.synology.me/concertjournal:cache,mode=max

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: registry.wielandseb.synology.me/concertjournal:${{ steps.generate-version.outputs.new_version }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push version tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.generate-version.outputs.new_version }}
          git push origin ${{ steps.generate-version.outputs.new_version }}
          echo "Successfully pushed tag ${{ steps.generate-version.outputs.new_version }}"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [changes, trigger-backend, trigger-frontend, build-and-publish]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Components Tested" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.trigger-backend.result }}" == "success" ]]; then
            echo "- Backend: passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.trigger-backend.result }}" == "skipped" ]]; then
            echo "- Backend: skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Backend: ${{ needs.trigger-backend.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.trigger-frontend.result }}" == "success" ]]; then
            echo "- Frontend: passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.trigger-frontend.result }}" == "skipped" ]]; then
            echo "- Frontend: skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Frontend: ${{ needs.trigger-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Image" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" != "pull_request" ]]; then
            if [[ "${{ needs.build-and-publish.result }}" == "success" ]]; then
              echo "- Unified image pushed: ${{ needs.build-and-publish.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            elif [[ "${{ needs.build-and-publish.result }}" == "skipped" ]]; then
              echo "- Image build skipped" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Image build failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- Image build: only runs on main" >> $GITHUB_STEP_SUMMARY
          fi
