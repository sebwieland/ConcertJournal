version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    # Dependabot's group update-type filter doesn't hold majors out (verified in updater logs),
    # so every held major is hard-ignored here until its migration session. Delete the entry then.
    ignore:
      # web-vitals 3+ replaced getCLS/getFID/... with onCLS/onINP/... — port reportWebVitals.ts first
      - dependency-name: "web-vitals"
        versions: [">=3"]
      # musicbrainz-api turned IArtistMatch from interface into a type alias at 0.25 —
      # collides with our `declare module` augmentation (TS2300). Migration = rework the
      # augmentation (augment only IArtist.tags), then delete this hold.
      - dependency-name: "musicbrainz-api"
        versions: [">=0.25"]
      # --- dev toolchain majors: each needs a dedicated upgrade session ---
      # vite 8 + plugin-react 6 + sitemap/tsconfig-paths move together
      - dependency-name: "vite"
        versions: [">=6"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=5"]
      - dependency-name: "vite-tsconfig-paths"
        versions: [">=5"]
      - dependency-name: "vite-plugin-sitemap"
        versions: [">=0.6"]
      # vitest 5 + @vitest/coverage-v8 5 move together
      - dependency-name: "vitest"
        versions: [">=2"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=2"]
      # eslint 10 needs migration to v10 flat-config + typescript-eslint 8+
      - dependency-name: "eslint"
        versions: [">=9"]
      - dependency-name: "@typescript-eslint/*"
        versions: [">=8"]
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=5"]
      # TypeScript 7 is a different compiler (Go port) — plan separately
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "@testing-library/jest-dom"
        versions: [">=7"]
      - dependency-name: "jsdom"
        versions: [">=24"]
      - dependency-name: "@types/node"
        versions: [">=23"]
      - dependency-name: "@types/jest"
        versions: [">=30"]
      - dependency-name: "cross-env"
        versions: [">=8"]
    groups:
      # @mui/* must move in lockstep (material + x-charts + x-data-grid + x-date-pickers).
      # NOTE: groups do NOT support update-type (schema rejects it) — majors inside
      # these groups are held off by the `ignore:` blocks above instead.
      mui:
        patterns:
          - "@mui/*"
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "@mui/*"
      dev-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"

  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    # mysql-connector-j 26.x is the new release-numbering line; re-check compat (Boot 4.1, Java 21) before letting it in.
    ignore:
      - dependency-name: "com.mysql:mysql-connector-j"
        versions: [">=26.0.0"]
    groups:
      # everything together except Spring Boot itself — the parent takes its own PR
      backend-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot:*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      actions-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
