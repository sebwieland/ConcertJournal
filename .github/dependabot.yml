version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    # React 19 must arrive as a MANUALLY-driven migration (react-query v3 -> @tanstack/react-query v5).
    # Dependabot's group update-type filter doesn't hold majors out (verified in updater logs),
    # so these get hard-ignored until that session. Delete the entries then.
    ignore:
      - dependency-name: "react"
        versions: [">=19"]
      - dependency-name: "react-dom"
        versions: [">=19"]
      - dependency-name: "web-vitals"
        versions: [">=3"]
    groups:
      # @mui/* must move in lockstep (material + x-charts + x-data-grid + x-date-pickers)
      # update-type:minor keeps MAJORS (v7->v8/v9, react 18->19) OUT of group PRs —
      # a recreate once rolled react@19 + x-charts@9 into a mixed PR that broke react-query v3.
      mui:
        patterns:
          - "@mui/*"
        update-type: "minor"
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "@mui/*"
        update-type: "minor"
      dev-dependencies:
        dependency-type: "development"
        update-type: "minor"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"

  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      # everything together except Spring Boot itself — the parent takes its own PR
      backend-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot:*"
        update-type: "minor"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      actions-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
